<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Booking System - Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="ph-fill ph-heartbeat logo-icon"></i>
                <h2>MedBook Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active">
                    <i class="ph ph-squares-four"></i>
                    Dashboard
                </button>
            </nav>
            <div class="sidebar-footer">
                <button onclick="adminLogout()" class="nav-item logout">
                    <i class="ph ph-sign-out"></i>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-search">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="header-profile">
                    <div class="user-info">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=2563EB&color=fff" alt="Admin" class="avatar">
                        <div class="user-details">
                            <span class="user-name" id="adminName">Admin User</span>
                            <span class="user-role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard">
                <div class="dashboard-header">
                    <h1>Admin Dashboard</h1>
                    <p>Welcome back, here's the overview of your system.</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon primary">
                            <i class="ph ph-calendar-check"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Appointments</h3>
                            <p class="stat-value" id="statTotal">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="ph ph-clock"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Pending</h3>
                            <p class="stat-value" id="statPending">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="ph ph-check-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Approved</h3>
                            <p class="stat-value" id="statApproved">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon danger">
                            <i class="ph ph-x-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Rejected</h3>
                            <p class="stat-value" id="statRejected">0</p>
                        </div>
                    </div>
                </div>

                <div class="content-grid">
                    <div class="card table-card doctors-card">
                        <div class="card-header">
                            <h2>Manage Doctors</h2>
                            <button class="btn btn-primary" id="addDoctorBtn">
                                <i class="ph ph-plus"></i> Add Doctor
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="data-table" id="doctorsTable">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Specialization</th>
                                        <th>Experience</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Populated via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card list-card appointments-card">
                        <div class="card-header">
                            <h2>Recent Appointments</h2>
                        </div>
                        <div class="appointment-list" id="appointmentList">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Doctor Modal -->
    <div class="modal-overlay" id="addDoctorModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Add New Doctor</h2>
                <button class="icon-btn close-modal" id="closeModalBtn">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addDoctorForm">
                    <div class="form-group">
                        <label for="docName">Full Name</label>
                        <input type="text" id="docName" placeholder="Dr. Jane Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="docSpec">Specialization</label>
                        <select id="docSpec" required>
                            <option value="" disabled selected>Select a specialization</option>
                            <option value="Cardiologist">Cardiologist</option>
                            <option value="Neurologist">Neurologist</option>
                            <option value="Pediatrician">Pediatrician</option>
                            <option value="Orthopedic">Orthopedic</option>
                            <option value="Dermatologist">Dermatologist</option>
                            <option value="General Physician">General Physician</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="docExp">Experience (Years)</label>
                        <input type="number" id="docExp" placeholder="e.g. 5" min="0" required>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Doctor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
