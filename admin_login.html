<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Doctor Appointment System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="patient_styles.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2>Admin Login</h2>
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-large" style="background-color: var(--text-dark);">Login as Admin</button>
        </form>
        <div class="auth-links">
            <p><a href="login.html" style="color: var(--text-muted);">&larr; Back to Patient Login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if(data.status === 'success' && data.user.role === 'admin') {
                    localStorage.setItem('admin_user', JSON.stringify(data.user));
                    window.location.href = 'index.html'; // Admin dashboard
                } else {
                    alert(data.message || 'Invalid credentials or role.');
                }
            } catch(err) {
                alert('Connection failed');
            }
        });
    </script>
</body>
</html>
