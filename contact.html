<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Doctor Appointment System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="patient_styles.css">
</head>
<body class="form-page" style="align-items: flex-start;">
    <nav class="navbar" style="position: absolute; width: 100%; top: 0;">
        <div class="container nav-container">
            <a href="patient_landing.html" class="logo">
                <i class="ph-fill ph-heartbeat"></i>
                <span>MedBook</span>
            </a>
            <div class="nav-links">
                <a href="patient_landing.html" class="nav-link">&larr; Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="form-card large" style="margin-top: 120px;">
        <h2>Contact Us</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom: 32px;">We're here to help. Send us a message or call our emergency line.</p>
        
        <form id="contactForm">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-large">Send Message</button>
        </form>
    </div>
    
    <script>
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Message sent successfully! We will get back to you soon.");
            window.location.href = 'patient_landing.html';
        });
    </script>
</body>
</html>
